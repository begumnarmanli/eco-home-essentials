<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İletişim</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">EcoHome Essentials</h1>
        <nav class="nav">
          <ul>
            <li><a href="index.html">Ana Sayfa</a></li>
            <li><a href="urunler.html">Ürünlerimiz</a></li>
            <li><a href="hakkimizda.html">Hakkımızda</a></li>
            <li><a href="iletisim.html">İletişim</a></li>
            <li class="cart-container">
              <a href="#cart" id="cart-btn" class="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
              </a>
              <div class="menu-favorite-btn" id="favorite-btn">
                <i class="fas fa-heart" id="heart-icon"></i>
                <span id="favorite-count">0</span>
              </div>
              <div id="favorite-container" class="favorite-container">
                <button class="close-fav-btn">×</button>
                <p>Henüz favori ürün yok.</p>
              </div>
            </li>
          </ul>
        </nav>
      </div>
      <div class="hamburger" id="hamburger">&#9776;</div>
    </header>
    <div class="cart-items-container">
      <div class="cart-item"></div>
    </div>

    <main>
      <section class="contact" id="contact">
        <h2>İletişim</h2>
        <form class="contact-form">
          <input type="text" placeholder="Adınız" required />
          <input type="email" placeholder="E-posta" required />
          <textarea placeholder="Mesajınız" rows="5" required></textarea>
          <button type="submit" class="btn">Gönder</button>
        </form>
        <div class="contact-info">
          <h3>Bizimle İletişime Geçin</h3>
          <p>E-posta: <a href="mailto:info@ecohome.com">info@ecohome.com</a></p>
          <p>Telefon: <a href="tel:+905012345678">+90 501 234 56 78</a></p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>
        <span class="footer-item main-title"
          >&copy; 2023 EcoHome Essentials.</span
        >
        <span class="footer-item sub-items">
          Web Tasarım: <span class="shimmer-text">Begüm Narmanlı</span>
        </span>
        <span class="footer-item sub-items">Tüm hakları saklıdır.</span>
      </p>
    </footer>
    <script src="e_ticaret.js"></script>
  </body>
</html>
